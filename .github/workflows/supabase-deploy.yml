name: Push-Dienst auf Supabase einspielen

# Spielt die Funktion supabase/functions/push auf Mirellas Supabase-Projekt
# und hinterlegt dort die Apple-Push-Schlüssel aus den GitHub-Secrets.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/supabase-deploy.yml"]
  workflow_dispatch:

env:
  PROJECT: xcanrhlwcopamhnmmlja

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Schlüssel vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt noch."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Geheimnisse setzen
        env:
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
        run: |
          BODY=$(printf '%s' "$APNS_KEY_P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \n\t')
          APNS_KEY_P8=$({ echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; })
          if ! printf '%s\n' "$APNS_KEY_P8" | openssl pkey -noout 2>/dev/null; then
            echo "::error::Secret APNS_KEY_P8 ist kein gültiger Schlüssel (Länge ohne Rahmen: ${#BODY} Zeichen, erwartet etwa 200). Bitte den ganzen Inhalt der Push-Datei AuthKey_….p8 einfügen."; exit 1; fi
          PUSH_SECRET=$(printf '%s' "mirella-push:$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -c1-48)
          supabase secrets set --yes --project-ref $PROJECT \
            APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" \
            APNS_KEY_ID="${{ secrets.APNS_KEY_ID }}" \
            APNS_KEY_P8="$APNS_KEY_P8" \
            PUSH_SECRET="$PUSH_SECRET"
      - name: Funktion einspielen
        run: supabase functions deploy push --yes --project-ref $PROJECT --no-verify-jwt
