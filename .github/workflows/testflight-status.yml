# Zeigt, wie weit Apple die letzten hochgeladenen Versionen verarbeitet hat (nur lesen, gibt keine Schlüssel aus).
name: TestFlight-Status
on: workflow_dispatch
permissions: { contents: read }
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Builds bei App Store Connect abfragen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests, re
          body = re.sub(r'-----[A-Z ]*-----', '', os.environ['ASC_KEY_P8'].replace('\r', ''))
          body = re.sub(r'\s+', '', body)
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(body[i:i+64] for i in range(0, len(body), 64)) + '\n-----END PRIVATE KEY-----\n'
          now = int(time.time())
          tok = jwt.encode({'iss': os.environ['ASC_ISSUER_ID'], 'iat': now, 'exp': now + 600, 'aud': 'appstoreconnect-v1'}, pem, algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'})
          H = {'Authorization': 'Bearer ' + tok}
          apps = requests.get('https://api.appstoreconnect.apple.com/v1/apps', params={'filter[bundleId]': 'de.brenzinger.mirella'}, headers=H).json()
          app = apps['data'][0]['id']
          r = requests.get('https://api.appstoreconnect.apple.com/v1/builds', params={'filter[app]': app, 'sort': '-uploadedDate', 'limit': 6, 'include': 'preReleaseVersion,buildBetaDetail'}, headers=H).json()
          inc = {(x['type'], x['id']): x['attributes'] for x in r.get('included', [])}
          for b in r.get('data', []):
              a = b['attributes']; rel = b['relationships']
              pv = rel.get('preReleaseVersion', {}).get('data') or {}
              bd = rel.get('buildBetaDetail', {}).get('data') or {}
              ver = inc.get((pv.get('type'), pv.get('id')), {}).get('version', '?')
              beta = inc.get((bd.get('type'), bd.get('id')), {})
              print(f"Version {ver} Build {a.get('version')}: hochgeladen {a.get('uploadedDate')}, Verarbeitung {a.get('processingState')}, abgelaufen {a.get('expired')}, intern {beta.get('internalBuildState')}, extern {beta.get('externalBuildState')}")
          if 'errors' in r: print(r['errors'])
          # Hochgeladene Pakete (auch abgelehnte, die nie als Build erscheinen) mit Apples Fehlermeldungen
          for url, prm in (('https://api.appstoreconnect.apple.com/v1/apps/' + app + '/buildUploads', {'limit': 6}),
                           ('https://api.appstoreconnect.apple.com/v1/buildUploads', {'filter[app]': app, 'limit': 6})):
              u = requests.get(url, params=prm, headers=H)
              print('Abfrage Uploads:', u.status_code)
              if u.status_code != 200: continue
              for b in u.json().get('data', []):
                  a = b.get('attributes', {})
                  st = a.get('state') or {}
                  print(f"Upload {a.get('cfBundleShortVersionString')} Build {a.get('cfBundleVersion')}: erstellt {a.get('createdDate')}, Zustand {st.get('state') if isinstance(st, dict) else st}")
                  if isinstance(st, dict):
                      for k in ('errors', 'warnings'):
                          for e in st.get(k) or []:
                              print('   ', k, e.get('code'), e.get('description') or e.get('message') or e)
              break
          # Vertriebszertifikate im Konto (nur Name, Art, Ablauf; keine Inhalte)
          c = requests.get('https://api.appstoreconnect.apple.com/v1/certificates', params={'limit': 50, 'fields[certificates]': 'name,displayName,certificateType,expirationDate,platform'}, headers=H)
          print('Abfrage Zertifikate:', c.status_code)
          for x in c.json().get('data', []):
              a = x['attributes']
              print(f"Zertifikat {x['id']}: {a.get('certificateType')} {a.get('displayName') or a.get('name')} gueltig bis {a.get('expirationDate')}")
          PY
