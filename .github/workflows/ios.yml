name: iPhone-App an TestFlight

# Baut die Web-App aus app/ als echte iPhone-App (Capacitor) und lädt sie zu TestFlight.
# Läuft von Hand (Actions > "iPhone-App an TestFlight" > Run workflow) und automatisch
# alle zwei Monate, damit die 90-Tage-Frist von TestFlight nie abläuft.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 */2 *"

jobs:
  testflight:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Schlüssel vorhanden?
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Apple-Schlüssel fehlen noch (Secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID) – Anleitung im Mirella-Chat."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Capacitor vorbereiten
        working-directory: native
        run: |
          npm install
          npx cap sync ios
      - name: Apple-Schlüssel ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Schlüssel säubern (Windows-Zeilenenden, fehlende Umbrüche) und prüfen,
          # damit ein Tippfehler im Secret sofort verständlich gemeldet wird.
          mkdir -p ~/private_keys
          F=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::Secret ASC_KEY_P8 ist leer oder fehlt."; exit 1; fi
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$F"
          if ! openssl pkey -in "$F" -noout 2>/dev/null; then
            echo "::error::Secret ASC_KEY_P8 ist kein gültiger Schlüssel (Länge ohne Rahmen: ${#BODY} Zeichen, erwartet etwa 200). Bitte den ganzen Inhalt der Datei AuthKey_….p8 einfügen."; exit 1; fi
          if [ ${#ASC_KEY_ID} -ne 10 ]; then echo "::warning::ASC_KEY_ID hat ${#ASC_KEY_ID} Zeichen, üblich sind 10."; fi
          if [ ${#ASC_ISSUER_ID} -ne 36 ]; then echo "::warning::ASC_ISSUER_ID hat ${#ASC_ISSUER_ID} Zeichen, üblich sind 36 (Form 12345678-abcd-…)."; fi
      - name: Xcode wählen
        run: |
          # Apple nimmt nur noch Apps an, die mit Xcode 26 oder neuer gebaut sind.
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Signatur einrichten
        run: python3 native/signatur.py einrichten
      - name: Bauen und hochladen
        working-directory: native/ios/App
        run: |
          VERSION=$(node -p "require('../../package.json').version")
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/Mirella.xcarchive \
            MARKETING_VERSION=$VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Mirella.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/export \
            -authenticationKeyPath $HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID
      - name: Signatur aufräumen
        if: always()
        run: python3 native/signatur.py aufraeumen
