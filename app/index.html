<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mirella">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./app-icon-180.png">
<link rel="icon" type="image/svg+xml" href="./logo-final.svg">
<title>Mirella</title>
<link rel="stylesheet" href="./style.css?v=17">
<link rel="stylesheet" href="./farbe.css?v=17">
</head>
<body>
<div class="phone" id="phone">
  <div class="screen" id="screen"></div>
  <button class="fab" id="plus" aria-label="Neu anlegen" hidden>+</button>
  <nav class="tabbar" aria-label="Reiter">
    <button class="tab" data-v="heute"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Heute</span></button>
    <button class="tab" data-v="menschen"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg><span>Kontakte</span></button>
    <button class="mic" id="mic" aria-label="Spracheingabe"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="tab" data-v="todos"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12l3 3 5-6"/></svg><span>To-dos</span></button>
    <button class="tab" data-v="kalender"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r=".8" fill="currentColor"/><circle cx="12" cy="14.5" r=".8" fill="currentColor"/><circle cx="15.5" cy="14.5" r=".8" fill="currentColor"/></svg><span>Kalender</span></button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Alle Bereiche">
    <div class="dhead"><div><div class="label">Mirella kümmert sich um</div><p class="big" style="margin:2px 0 0;font-size:24px">Alle Bereiche</p></div><button class="iconbtn" data-close="drawer" aria-label="Menü schließen">✕</button></div>
    <div class="dbody" id="dbody"></div>
    <div class="dfoot"><button class="btn setbtn" data-act="go" data-v="einstellungen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Einstellungen</button></div>
  </aside>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"><button class="x" data-close="sheet" aria-label="Schließen">✕</button><div id="sheetbody"></div></div>
</div>
<input type="file" id="f-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="f-lib" accept="image/*" hidden>
<input type="file" id="f-import" accept=".json,application/json" hidden>
<input type="file" id="f-brief" accept="application/pdf,.pdf,image/*" multiple hidden>
<input type="file" id="f-doc" accept="application/pdf,.pdf,image/*" hidden>
<input type="file" id="f-shopimg" accept="image/*" hidden>
<input type="file" id="f-avatar" accept="image/*" hidden>
<input type="file" id="f-vcf" accept=".vcf,text/vcard,text/x-vcard" hidden>
<script src="./logik.js?v=17"></script>
<script src="./app.js?v=17"></script>
<script src="./bereiche.js?v=17"></script>
<script src="./scan.js?v=17"></script>
<script src="./wecker.js?v=17"></script>
<script src="./suche.js?v=17"></script>
<script src="./export.js?v=17"></script>
<script src="./wetter.js?v=17"></script>
<script src="./viewer.js?v=17"></script>
<script src="./sync.js?v=17"></script>
<script src="./native.js?v=17"></script>
</body>
</html>
