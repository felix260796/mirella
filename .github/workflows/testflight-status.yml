# Zeigt, wie weit Apple die letzten hochgeladenen Versionen verarbeitet hat (nur lesen, gibt keine Schlüssel aus).
name: TestFlight-Status
on: workflow_dispatch
permissions: { contents: read }
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Builds bei App Store Connect abfragen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests, re
          body = re.sub(r'-----[A-Z ]*-----', '', os.environ['ASC_KEY_P8'].replace('\r', ''))
          body = re.sub(r'\s+', '', body)
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(body[i:i+64] for i in range(0, len(body), 64)) + '\n-----END PRIVATE KEY-----\n'
          now = int(time.time())
          tok = jwt.encode({'iss': os.environ['ASC_ISSUER_ID'], 'iat': now, 'exp': now + 600, 'aud': 'appstoreconnect-v1'}, pem, algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'})
          H = {'Authorization': 'Bearer ' + tok}
          apps = requests.get('https://api.appstoreconnect.apple.com/v1/apps', params={'filter[bundleId]': 'de.brenzinger.mirella'}, headers=H).json()
          app = apps['data'][0]['id']
          r = requests.get('https://api.appstoreconnect.apple.com/v1/builds', params={'filter[app]': app, 'sort': '-uploadedDate', 'limit': 6, 'include': 'preReleaseVersion,buildBetaDetail'}, headers=H).json()
          inc = {(x['type'], x['id']): x['attributes'] for x in r.get('included', [])}
          for b in r.get('data', []):
              a = b['attributes']; rel = b['relationships']
              pv = rel.get('preReleaseVersion', {}).get('data') or {}
              bd = rel.get('buildBetaDetail', {}).get('data') or {}
              ver = inc.get((pv.get('type'), pv.get('id')), {}).get('version', '?')
              beta = inc.get((bd.get('type'), bd.get('id')), {})
              print(f"Version {ver} Build {a.get('version')}: hochgeladen {a.get('uploadedDate')}, Verarbeitung {a.get('processingState')}, abgelaufen {a.get('expired')}, intern {beta.get('internalBuildState')}, extern {beta.get('externalBuildState')}")
          if 'errors' in r: print(r['errors'])
          PY
