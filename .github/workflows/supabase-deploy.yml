name: Push-Dienst auf Supabase einspielen

# Spielt die Funktion supabase/functions/push auf Mirellas Supabase-Projekt
# und hinterlegt dort die Apple-Push-Schlüssel aus den GitHub-Secrets.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/supabase-deploy.yml"]
  workflow_dispatch:

env:
  PROJECT: xcanrhlwcopamhnmmlja

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Schlüssel vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt noch."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Geheimnisse setzen
        env:
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
        run: |
          PUSH_SECRET=$(printf '%s' "mirella-push:$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -c1-48)
          supabase secrets set --project-ref $PROJECT \
            APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" \
            APNS_KEY_ID="${{ secrets.APNS_KEY_ID }}" \
            APNS_KEY_P8="$APNS_KEY_P8" \
            PUSH_SECRET="$PUSH_SECRET"
      - name: Funktion einspielen
        run: supabase functions deploy push --project-ref $PROJECT --no-verify-jwt
